name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn jinja2 python-multipart pywebview fpdf2 pyinstaller pillow pydantic

    - name: Create build dir and convert PNG to ICO
      run: |
        mkdir build
        python - <<'PY'
from PIL import Image
Image.open('static/logo.png').save('build/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
print('Wrote build/icon.ico')
PY

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm --clean --onefile \
          --name DrKhanApp \
          --add-data "static/logo.png;static" \
          --add-data "build/icon.ico;." \
          --icon "build/icon.ico" \
          main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: drkhan-windows-exe
        path: dist/DrKhanApp.exe
        retention-days: 30
